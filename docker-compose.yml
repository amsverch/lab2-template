
services:
  postgres:
    image: library/postgres:13
    container_name: postgres
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/:/docker-entrypoint-initdb.d/
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  bonus:
    build:
      context: .
      dockerfile: services/bonus/Dockerfile
    restart: on-failure
    environment:
      DATABASE_URL: postgresql+psycopg2://program:test@postgres:5432/privileges
    ports:
      - "8050:8050"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8050/manage/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  flight:
    build:
      context: .
      dockerfile: services/flight/Dockerfile
    restart: on-failure
    environment:
      DATABASE_URL: postgresql+psycopg2://program:test@postgres:5432/flights
    ports:
      - "8060:8060"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8060/manage/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ticket:
    build:
      context: .
      dockerfile: services/ticket/Dockerfile
    restart: on-failure
    environment:
      DATABASE_URL: postgresql+psycopg2://program:test@postgres:5432/tickets
    ports:
      - "8070:8070"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8070/manage/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    restart: on-failure
    environment:
      FLIGHT_SERVICE_URL: http://flight:8060
      TICKET_SERVICE_URL: http://ticket:8070
      BONUS_SERVICE_URL: http://bonus:8050
    ports:
      - "8080:8080"
    depends_on:
      bonus:
        condition: service_healthy
      flight:
        condition: service_healthy
      ticket:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/manage/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
